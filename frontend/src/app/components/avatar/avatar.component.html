<div class="avatar-widget compact-avatar">
  <div class="toggle-row">
    <span class="live-indicator" [class.enabled]="avatarEnabled"></span>
    <button class="toggle-button" (click)="toggleAvatar()">
      {{ avatarEnabled ? 'Disable' : 'Enable' }}
    </button>
  </div>

  <div class="avatar-stage" [class.live-ready]="liveAvatarReady">
    <video
      *ngIf="liveAvatarReady && liveAvatarUrl"
      [src]="liveAvatarUrl"
      autoplay
      muted
      loop
      playsinline
      class="avatar-video"
    ></video>

    <div *ngIf="!liveAvatarReady || !liveAvatarUrl" class="avatar-placeholder">
      <div class="avatar-glow"></div>
      <div class="avatar-face">
        <span class="avatar-eye left"></span>
        <span class="avatar-eye right"></span>
        <span class="avatar-mouth"></span>
      </div>
    </div>
  </div>

  <div class="avatar-status">
    <div class="avatar-name">{{ liveAvatarName }}</div>
    <div class="avatar-state" [class.listening]="isListening" [class.processing]="loading">
      {{ liveAvatarStatus }}
    </div>
  </div>
</div>
